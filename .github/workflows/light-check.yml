# Advisory pull request check. It is deliberately small and never required:
# hosted CI was removed in #124 when an exhausted Actions quota failed every run
# and blocked merges. The local promotion gate (`pnpm check`) stays the
# authoritative validation. Budget and sizing: docs/deployment-promotion.md.
# Disable with `gh workflow disable light-check.yml`.
name: Light check

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # A run is skipped only when every changed file matches these patterns.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'graphify/**'

permissions:
  contents: read

concurrency:
  group: light-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          # No dependency cache: restoring the 440 MB pnpm store took 12 s
          # against 17 s for an uncached install, and a pull request's first
          # run has no cache to restore and paid 9 s more to save one.
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc -b
      - run: pnpm exec vite build
      - run: pnpm test:quick
