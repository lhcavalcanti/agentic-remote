name: Shell release

# Publishes installable native shell builds.
#
# CI already uploads a bundle for every commit, which is enough to install a
# specific change. This workflow exists for the builds worth keeping: it tags a
# version, produces a universal macOS binary that runs on both Apple Silicon and
# Intel, and attaches everything to a GitHub Release.
#
# Nothing here is signed yet. See docs/native-shell.md §5.1; once signing
# credentials exist they belong in this workflow as repository secrets.

on:
  push:
    tags: ['shell-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag, for example shell-v0.1.0'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
            # A universal binary means one download works on every Mac.
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin x86_64-apple-darwin
          - os: ubuntu-latest
            artifact: linux
            target: ''
            rust_targets: ''
          - os: windows-latest
            artifact: windows
            target: ''
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Add extra Rust targets
        if: matrix.rust_targets != ''
        run: rustup target add ${{ matrix.rust_targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri -> target
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libxdo-dev
      - run: pnpm install --frozen-lockfile
      - name: Generate bundle icons
        run: pnpm icons
      - name: Build
        run: pnpm tauri build ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # A universal build writes under its target directory rather than the
      # default one, so the collected paths differ per platform.
      - name: Stage release files
        shell: bash
        run: |
          set -euo pipefail
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ -z "${{ matrix.target }}" ]; then
            bundle="src-tauri/target/release/bundle"
          fi
          mkdir -p ../release
          found=0
          for pattern in \
            "$bundle"/dmg/*.dmg \
            "$bundle"/nsis/*-setup.exe \
            "$bundle"/deb/*.deb \
            "$bundle"/appimage/*.AppImage; do
            for file in $pattern; do
              if [ -f "$file" ]; then
                cp "$file" ../release/
                found=$((found + 1))
              fi
            done
          done
          if [ "$found" -eq 0 ]; then
            echo "No bundles were produced under $bundle" >&2
            exit 1
          fi
          ls -la ../release

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -la release
          # Creating the release also creates the tag when the run was started
          # manually; a re-run of an existing tag just replaces the assets.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* \
              --target "$GITHUB_SHA" \
              --title "Agentic Remote shell $RELEASE_TAG" \
              --notes "Unsigned builds. macOS is a universal binary. See shell/README.md for the first-open step Gatekeeper requires."
          fi
