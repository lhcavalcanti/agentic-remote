<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Remote settings</title>
    <link rel="stylesheet" href="/src/settings.css" />
  </head>
  <body>
    <main class="settings">
      <h1>Connect to a hub</h1>
      <p class="settings__lead">
        The shell opens your hub's own interface, so it stays signed in the same
        way your browser does.
      </p>

      <form id="settings-form" class="settings__form">
        <label class="settings__field">
          <span>Hub URL</span>
          <input
            id="hub-url"
            name="url"
            type="url"
            required
            spellcheck="false"
            autocomplete="off"
            placeholder="https://agentic.example.com"
          />
          <small>The address you normally open in the browser.</small>
        </label>

        <label class="settings__field">
          <span>Direct address <em>(optional)</em></span>
          <input
            id="hub-lan-url"
            name="lanUrl"
            type="url"
            spellcheck="false"
            autocomplete="off"
            placeholder="http://192.0.2.10:4317"
          />
          <small>Used as a fallback when the hub URL cannot be reached.</small>
        </label>

        <label class="settings__field">
          <span>Global shortcut</span>
          <input
            id="hub-shortcut"
            name="shortcut"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="CmdOrCtrl+Shift+A"
          />
          <small>Shows or hides the window from anywhere.</small>
        </label>

        <p id="settings-error" class="settings__error" role="alert" hidden></p>

        <button type="submit" class="settings__submit">Open hub</button>
      </form>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
