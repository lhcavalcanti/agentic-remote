[package]
name = "agentic-remote-shell"
version = "0.1.0"
description = "Native shell for supervising Agentic Remote sessions"
edition = "2021"
rust-version = "1.77.2"
publish = false

[lib]
name = "agentic_remote_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `dynamic-acl` lets the shell grant IPC to the hub the user configured at
# runtime instead of baking a hostname into the binary.
tauri = { version = "2", features = ["tray-icon", "dynamic-acl"] }
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The global shortcut plugin is desktop-only; the crate refuses to build for
# mobile targets, so it must not be a dependency there.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-global-shortcut = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
